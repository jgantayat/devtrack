<nz-layout class="app-layout">
  <nz-sider nzCollapsible nzWidth="240px" nzBreakpoint="md"
            [(nzCollapsed)]="collapsed" [nzTrigger]="null">
    <div class="logo">
      <span nz-icon nzType="thunderbolt" nzTheme="fill"></span>
      @if (!collapsed()) { <span class="logo-text">DevTrack</span> }
    </div>

    <ul nz-menu nzTheme="dark" nzMode="inline">
      <li nz-menu-item routerLink="/dashboard" routerLinkActive="ant-menu-item-selected">
        <span nz-icon nzType="dashboard"></span>
        <span>Dashboard</span>
      </li>
      <li nz-menu-item routerLink="/tasks" routerLinkActive="ant-menu-item-selected">
        <span nz-icon nzType="check-square"></span>
        <span>Tasks</span>
      </li>
      <li nz-menu-item routerLink="/goals" routerLinkActive="ant-menu-item-selected">
        <span nz-icon nzType="trophy"></span>
        <span>Goals</span>
      </li>
      <li nz-menu-item routerLink="/log" routerLinkActive="ant-menu-item-selected">
        <span nz-icon nzType="book"></span>
        <span>Daily Log</span>
      </li>
      <li nz-menu-item routerLink="/settings" routerLinkActive="ant-menu-item-selected">
        <span nz-icon nzType="setting"></span>
        <span>Settings</span>
      </li>
    </ul>
  </nz-sider>

  <nz-layout>
    <nz-header class="app-header">
      <span nz-icon class="trigger" [nzType]="collapsed() ? 'menu-unfold' : 'menu-fold'"
            (click)="toggleCollapse()"></span>
      <div class="header-right">
        <nz-avatar nzText="J" [nzSize]="36" style="background: #1890ff"></nz-avatar>
      </div>
    </nz-header>

    <nz-content class="app-content">
      <router-outlet></router-outlet>
    </nz-content>

    <nz-footer class="app-footer">
      DevTrack ©2026 — built with NG-ZORRO
    </nz-footer>
  </nz-layout>
</nz-layout>
